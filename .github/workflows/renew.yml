name: Katabump Auto Renew

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      tg_test:
        description: '只发送一条 Telegram 测试消息后退出'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Keepalive
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NOW_TS=$(date +%s)
          LAST_TS=$(git log -1 --format=%ct)
          IDLE_DAYS=$(( (NOW_TS - LAST_TS) / 86400 ))
          echo "Last commit was ${IDLE_DAYS} day(s) ago."
          if [ "${IDLE_DAYS}" -lt 30 ]; then
            echo "Recent activity detected, skipping keepalive commit."
            exit 0
          fi
          echo "Idle for ${IDLE_DAYS} days, creating keepalive commit."
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git add .keepalive
          git commit -m "chore: keepalive"
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Telegram Test
        if: ${{ inputs.tg_test }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "TG_BOT_TOKEN / TG_CHAT_ID 未配置"
            exit 1
          fi
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "text=katabump 续期脚本 TG 自检消息 ✅" | head -c 400
          echo

      - name: Install Dependencies
        if: ${{ !inputs.tg_test }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: Run Renew Script
        if: ${{ !inputs.tg_test }}
        env:
          USERS_JSON: ${{ secrets.USERS_JSON }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 app.py

      - name: Upload Screenshots
        if: ${{ always() && !inputs.tg_test }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: '*.png'
          if-no-files-found: warn
